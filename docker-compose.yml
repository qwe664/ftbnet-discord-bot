services:
  bot:
    build: .
    container_name: ftbnet-discord-bot
    restart: always
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    env_file:
      - .env
    environment:
      - DISCORD_BOT_TOKEN_FILE=/run/secrets/discord_bot_token
      - PTERO_API_KEY_FILE=/run/secrets/ptero_api_key
    secrets:
      - discord_bot_token
      - ptero_api_key
    volumes:
      - ./logs:/app/logs
      - ./bot_state.json:/app/bot_state.json
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,time; p='/tmp/discord-bot-ready'; raise SystemExit(0 if time.time() - os.stat(p).st_mtime < 60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 30s

secrets:
  discord_bot_token:
    file: ./secrets/DISCORD_BOT_TOKEN
  ptero_api_key:
    file: ./secrets/PTERO_API_KEY
